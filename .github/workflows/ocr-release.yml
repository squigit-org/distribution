name: "OCR Release"

on:
  push:
    tags:
      - "ocr-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "OCR semantic version (for example: 0.2.0)"
        required: true
        default: "0.1.1"
        type: string
      source_ref:
        description: "Squigit source branch or tag to build"
        required: false
        default: "main"
        type: string
      release_tag:
        description: "Optional distribution release tag; defaults to ocr-v<version>"
        required: false
        default: ""
        type: string
      release_homebrew:
        description: "Run the Homebrew lane"
        required: false
        default: false
        type: boolean
      release_winget:
        description: "Run the Winget lane"
        required: false
        default: false
        type: boolean
      submit_winget_pr:
        description: "Submit or update the winget-pkgs PR"
        required: false
        default: false
        type: boolean
      release_apt:
        description: "Run the APT lane"
        required: false
        default: false
        type: boolean
      release_dnf:
        description: "Run the DNF lane"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ocr-release
  cancel-in-progress: false

jobs:
  resolve-channel-scope:
    name: Resolve Channel Scope
    runs-on: ubuntu-latest
    outputs:
      run_homebrew: ${{ steps.scope.outputs.run_homebrew }}
      run_winget: ${{ steps.scope.outputs.run_winget }}
      run_apt: ${{ steps.scope.outputs.run_apt }}
      run_dnf: ${{ steps.scope.outputs.run_dnf }}
    steps:
      - name: Resolve channels
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            run_homebrew=true
            run_winget=true
            run_apt=true
            run_dnf=true
          else
            run_homebrew="${{ inputs.release_homebrew }}"
            run_winget="${{ inputs.release_winget }}"
            run_apt="${{ inputs.release_apt }}"
            run_dnf="${{ inputs.release_dnf }}"
          fi

          if [ "${run_homebrew}" != "true" ] \
            && [ "${run_winget}" != "true" ] \
            && [ "${run_apt}" != "true" ] \
            && [ "${run_dnf}" != "true" ]; then
            echo "At least one release channel must be enabled." >&2
            exit 1
          fi

          echo "run_homebrew=${run_homebrew}" >> "$GITHUB_OUTPUT"
          echo "run_winget=${run_winget}" >> "$GITHUB_OUTPUT"
          echo "run_apt=${run_apt}" >> "$GITHUB_OUTPUT"
          echo "run_dnf=${run_dnf}" >> "$GITHUB_OUTPUT"

  resolve-release-meta:
    name: Resolve Release Metadata
    needs: resolve-channel-scope
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
    steps:
      - name: Resolve version, tag, and source ref
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            release_tag="${{ inputs.release_tag }}"
            source_ref="${{ inputs.source_ref }}"
          else
            release_tag="${GITHUB_REF_NAME}"
            version="${release_tag#ocr-v}"
            source_ref="main"
          fi

          if [ -z "${release_tag}" ]; then
            release_tag="ocr-v${version}"
          fi
          if [ -z "${source_ref}" ]; then
            source_ref="main"
          fi
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid OCR semantic version: ${version}" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "source_ref=${source_ref}" >> "$GITHUB_OUTPUT"

  build-source-runtimes:
    name: Build Source Runtimes
    needs:
      - resolve-channel-scope
      - resolve-release-meta
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.source.outputs.run-id }}
      source_sha: ${{ steps.source.outputs.source-sha }}
      run_url: ${{ steps.source.outputs.run-url }}
    steps:
      - name: Checkout Distribution
        uses: actions/checkout@v6

      - name: Run Squigit OCR matrix
        id: source
        uses: ./.github/actions/run-squigit-ocr-build
        with:
          token: ${{ secrets.SQUIGIT_GITHUB_TOKEN }}
          repository: squigit-org/squigit
          workflow: ocr-build-matrix.yml
          ref: ${{ needs.resolve-release-meta.outputs.source_ref }}
          request-id: distribution-${{ github.run_id }}-${{ github.run_attempt }}
          version: ${{ needs.resolve-release-meta.outputs.version }}

      - name: Publish source provenance
        shell: bash
        run: |
          echo "Source run: ${{ steps.source.outputs.run-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: ${{ steps.source.outputs.source-sha }}" >> "$GITHUB_STEP_SUMMARY"

  release-macos-runtime:
    name: Publish macOS Arm64 Runtime
    if: needs.resolve-channel-scope.outputs.run_homebrew == 'true'
    needs:
      - resolve-channel-scope
      - resolve-release-meta
      - build-source-runtimes
    runs-on: macos-14
    outputs:
      version: ${{ needs.resolve-release-meta.outputs.version }}
      asset_url: ${{ steps.meta.outputs.asset_url }}
      sha256: ${{ steps.meta.outputs.sha256 }}
    steps:
      - name: Download measured macOS runtime
        uses: actions/download-artifact@v8
        with:
          name: squigit-ocr-runtime-macos-arm
          path: ${{ runner.temp }}/squigit-ocr-macos
          github-token: ${{ secrets.SQUIGIT_GITHUB_TOKEN }}
          repository: squigit-org/squigit
          run-id: ${{ needs.build-source-runtimes.outputs.run_id }}

      - name: Validate runtime archive and version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.resolve-release-meta.outputs.version }}
        run: |
          set -euo pipefail
          asset="${RUNNER_TEMP}/squigit-ocr-macos/squigit-ocr-mac-aarch64.tar.gz"
          runtime="${RUNNER_TEMP}/squigit-ocr-macos/runtime"
          test -f "${asset}"
          test -f "${RUNNER_TEMP}/squigit-ocr-macos/ocr-size-aarch64-apple-darwin.json"
          mkdir -p "${runtime}"
          tar -xzf "${asset}" -C "${runtime}"
          chmod +x "${runtime}/squigit-ocr"
          actual_version="$("${runtime}/squigit-ocr" --version | tr -d '\r' | tail -n 1)"
          test "${actual_version}" = "${EXPECTED_VERSION}"

      - name: Upload Homebrew runtime to distribution release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-release-meta.outputs.release_tag }}
          name: OCR v${{ needs.resolve-release-meta.outputs.version }}
          files: ${{ runner.temp }}/squigit-ocr-macos/squigit-ocr-mac-aarch64.tar.gz
          overwrite_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export macOS release metadata
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-release-meta.outputs.release_tag }}
        run: |
          asset="${RUNNER_TEMP}/squigit-ocr-macos/squigit-ocr-mac-aarch64.tar.gz"
          echo "sha256=$(shasum -a 256 "${asset}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "asset_url=https://github.com/squigit-org/distribution/releases/download/${RELEASE_TAG}/squigit-ocr-mac-aarch64.tar.gz" >> "$GITHUB_OUTPUT"

  release-windows-runtime:
    name: Publish Windows x64 Runtime
    if: needs.resolve-channel-scope.outputs.run_winget == 'true'
    needs:
      - resolve-channel-scope
      - resolve-release-meta
      - build-source-runtimes
    runs-on: windows-latest
    outputs:
      version: ${{ needs.resolve-release-meta.outputs.version }}
      asset_url: ${{ steps.meta.outputs.asset_url }}
      sha256: ${{ steps.meta.outputs.sha256 }}
    steps:
      - name: Download measured Windows runtime
        uses: actions/download-artifact@v8
        with:
          name: squigit-ocr-runtime-windows-x64
          path: ${{ runner.temp }}/squigit-ocr-windows
          github-token: ${{ secrets.SQUIGIT_GITHUB_TOKEN }}
          repository: squigit-org/squigit
          run-id: ${{ needs.build-source-runtimes.outputs.run_id }}

      - name: Validate runtime archive and version
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.resolve-release-meta.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $asset = Join-Path $env:RUNNER_TEMP "squigit-ocr-windows/squigit-ocr-win-x64.zip"
          $runtime = Join-Path $env:RUNNER_TEMP "squigit-ocr-windows/runtime"
          if (-not (Test-Path -LiteralPath $asset)) { throw "Missing Windows runtime archive: $asset" }
          if (-not (Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP "squigit-ocr-windows/ocr-size-x86_64-pc-windows-msvc.json"))) {
            throw "Missing Windows runtime size report"
          }
          Expand-Archive -LiteralPath $asset -DestinationPath $runtime -Force
          $actualVersion = (& (Join-Path $runtime "squigit-ocr.exe") --version | Select-Object -Last 1).Trim()
          if ($actualVersion -ne $env:EXPECTED_VERSION) {
            throw "OCR version mismatch: built=$actualVersion expected=$env:EXPECTED_VERSION"
          }

      - name: Upload Winget runtime to distribution release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-release-meta.outputs.release_tag }}
          name: OCR v${{ needs.resolve-release-meta.outputs.version }}
          files: ${{ runner.temp }}/squigit-ocr-windows/squigit-ocr-win-x64.zip
          overwrite_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export Windows release metadata
        id: meta
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve-release-meta.outputs.release_tag }}
        run: |
          $asset = Join-Path $env:RUNNER_TEMP "squigit-ocr-windows/squigit-ocr-win-x64.zip"
          $sha = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "asset_url=https://github.com/squigit-org/distribution/releases/download/$env:RELEASE_TAG/squigit-ocr-win-x64.zip" >> $env:GITHUB_OUTPUT

  release-linux-packages:
    name: Package Linux x64 Runtime
    if: needs.resolve-channel-scope.outputs.run_apt == 'true' || needs.resolve-channel-scope.outputs.run_dnf == 'true'
    needs:
      - resolve-channel-scope
      - resolve-release-meta
      - build-source-runtimes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.resolve-release-meta.outputs.version }}
      deb_name: ${{ steps.artifacts.outputs.deb-name }}
      deb_sha256: ${{ steps.sha.outputs.deb_sha256 }}
      deb_asset_url: ${{ steps.meta.outputs.deb_asset_url }}
      rpm_name: ${{ steps.artifacts.outputs.rpm-name }}
      rpm_sha256: ${{ steps.sha.outputs.rpm_sha256 }}
      rpm_asset_url: ${{ steps.meta.outputs.rpm_asset_url }}
    steps:
      - name: Checkout Distribution
        uses: actions/checkout@v6

      - name: Download measured Ubuntu runtime
        uses: actions/download-artifact@v8
        with:
          name: squigit-ocr-runtime-ubuntu-x64
          path: ${{ runner.temp }}/squigit-ocr-linux/ubuntu
          github-token: ${{ secrets.SQUIGIT_GITHUB_TOKEN }}
          repository: squigit-org/squigit
          run-id: ${{ needs.build-source-runtimes.outputs.run_id }}

      - name: Download measured Fedora runtime
        uses: actions/download-artifact@v8
        with:
          name: squigit-ocr-runtime-fedora-x64
          path: ${{ runner.temp }}/squigit-ocr-linux/fedora
          github-token: ${{ secrets.SQUIGIT_GITHUB_TOKEN }}
          repository: squigit-org/squigit
          run-id: ${{ needs.build-source-runtimes.outputs.run_id }}

      - name: Install Linux packaging toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev apt-utils gnupg2

      - name: Extract and validate Linux runtimes
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.resolve-release-meta.outputs.version }}
        run: |
          set -euo pipefail
          ubuntu_root="${RUNNER_TEMP}/squigit-ocr-linux/ubuntu"
          fedora_root="${RUNNER_TEMP}/squigit-ocr-linux/fedora"
          ubuntu_runtime="${ubuntu_root}/runtime"
          fedora_runtime="${fedora_root}/runtime"
          test -f "${ubuntu_root}/squigit-ocr-ubuntu-x64.tar.gz"
          test -f "${ubuntu_root}/ocr-size-x86_64-unknown-linux-gnu.json"
          test -f "${fedora_root}/squigit-ocr-fedora-x64.tar.gz"
          test -f "${fedora_root}/ocr-size-x86_64-unknown-linux-gnu.json"
          mkdir -p "${ubuntu_runtime}" "${fedora_runtime}"
          tar -xzf "${ubuntu_root}/squigit-ocr-ubuntu-x64.tar.gz" -C "${ubuntu_runtime}"
          tar -xzf "${fedora_root}/squigit-ocr-fedora-x64.tar.gz" -C "${fedora_runtime}"
          chmod +x "${ubuntu_runtime}/squigit-ocr" "${fedora_runtime}/squigit-ocr"
          actual_version="$("${ubuntu_runtime}/squigit-ocr" --version | tr -d '\r' | tail -n 1)"
          test "${actual_version}" = "${EXPECTED_VERSION}"

      - name: Build Debian and RPM artifacts
        id: artifacts
        uses: ./.github/actions/squigit-ocr-linux-packaging
        with:
          ocr-version: ${{ needs.resolve-release-meta.outputs.version }}
          deb-runtime-dir: ${{ runner.temp }}/squigit-ocr-linux/ubuntu/runtime
          rpm-runtime-dir: ${{ runner.temp }}/squigit-ocr-linux/fedora/runtime
          binary-name: squigit-ocr
          deb-control-template: ${{ github.workspace }}/packaging/debian/squigit-ocr/DEBIAN/control
          rpm-spec-template: ${{ github.workspace }}/packaging/rpm/squigit-ocr.spec
          summary: Standalone CLI OCR engine for Squigit
          description-line-1: A headless, offline optical character recognition pipeline designed for Squigit.
          description-line-2: Includes the native runtime and its local dependencies for Linux x86_64.

      - name: Sign RPM artifact
        shell: bash
        env:
          RPM_PATH: ${{ steps.artifacts.outputs.rpm-path }}
          GPG_PRIVATE_KEY: ${{ secrets.LINUX_PACKAGES_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.LINUX_PACKAGES_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="${RUNNER_TEMP}/linux-rpm-sign-gnupg"
          mkdir -p "${GNUPGHOME}"
          chmod 700 "${GNUPGHOME}"
          printf '%s' "${GPG_PRIVATE_KEY}" | gpg --batch --import
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')"
          test -n "${fingerprint}"
          public_key="${RUNNER_TEMP}/linux-rpm-signing-key.asc"
          gpg --batch --yes --armor --output "${public_key}" --export "${fingerprint}"
          rpm --import "${public_key}"
          escaped_passphrase="$(printf '%s' "${GPG_PASSPHRASE}" | sed "s/'/'\"'\"'/g")"
          cat > "${HOME}/.rpmmacros" <<RPMMACROS
          %_signature gpg
          %_gpg_path ${GNUPGHOME}
          %_gpg_name ${fingerprint}
          %_gpgbin /usr/bin/gpg
          %__gpg /usr/bin/gpg
          %__gpg_sign_cmd %{__gpg} --batch --yes --no-armor --pinentry-mode loopback --passphrase '${escaped_passphrase}' --detach-sign --output %{__signature_filename} %{__plaintext_filename}
          RPMMACROS
          rpmsign --addsign "${RPM_PATH}"
          rpm --checksig --verbose "${RPM_PATH}"

      - name: Calculate package checksums
        id: sha
        shell: bash
        env:
          DEB_PATH: ${{ steps.artifacts.outputs.deb-path }}
          RPM_PATH: ${{ steps.artifacts.outputs.rpm-path }}
        run: |
          echo "deb_sha256=$(sha256sum "${DEB_PATH}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "rpm_sha256=$(sha256sum "${RPM_PATH}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload Linux packages to distribution release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-release-meta.outputs.release_tag }}
          name: OCR v${{ needs.resolve-release-meta.outputs.version }}
          files: |
            ${{ steps.artifacts.outputs.deb-path }}
            ${{ steps.artifacts.outputs.rpm-path }}
          overwrite_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export Linux release metadata
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-release-meta.outputs.release_tag }}
          DEB_NAME: ${{ steps.artifacts.outputs.deb-name }}
          RPM_NAME: ${{ steps.artifacts.outputs.rpm-name }}
        run: |
          echo "deb_asset_url=https://github.com/squigit-org/distribution/releases/download/${RELEASE_TAG}/${DEB_NAME}" >> "$GITHUB_OUTPUT"
          echo "rpm_asset_url=https://github.com/squigit-org/distribution/releases/download/${RELEASE_TAG}/${RPM_NAME}" >> "$GITHUB_OUTPUT"

  build-phase-complete:
    name: Build Phase Complete
    if: always()
    needs:
      - resolve-channel-scope
      - build-source-runtimes
      - release-macos-runtime
      - release-windows-runtime
      - release-linux-packages
    runs-on: ubuntu-latest
    steps:
      - name: Validate selected build results
        shell: bash
        env:
          RUN_HOMEBREW: ${{ needs.resolve-channel-scope.outputs.run_homebrew }}
          RUN_WINGET: ${{ needs.resolve-channel-scope.outputs.run_winget }}
          RUN_APT: ${{ needs.resolve-channel-scope.outputs.run_apt }}
          RUN_DNF: ${{ needs.resolve-channel-scope.outputs.run_dnf }}
          SOURCE_RESULT: ${{ needs.build-source-runtimes.result }}
          MAC_RESULT: ${{ needs.release-macos-runtime.result }}
          WINDOWS_RESULT: ${{ needs.release-windows-runtime.result }}
          LINUX_RESULT: ${{ needs.release-linux-packages.result }}
        run: |
          set -euo pipefail
          test "${SOURCE_RESULT}" = "success"
          if [ "${RUN_HOMEBREW}" = "true" ]; then test "${MAC_RESULT}" = "success"; fi
          if [ "${RUN_WINGET}" = "true" ]; then test "${WINDOWS_RESULT}" = "success"; fi
          if [ "${RUN_APT}" = "true" ] || [ "${RUN_DNF}" = "true" ]; then
            test "${LINUX_RESULT}" = "success"
          fi

  publish-linux-metadata:
    name: Publish Signed Linux Metadata
    if: >-
      always() &&
      needs.build-phase-complete.result == 'success' &&
      needs.release-linux-packages.result == 'success' &&
      (needs.resolve-channel-scope.outputs.run_apt == 'true' || needs.resolve-channel-scope.outputs.run_dnf == 'true')
    needs:
      - resolve-channel-scope
      - resolve-release-meta
      - build-phase-complete
      - release-linux-packages
    runs-on: ubuntu-latest
    concurrency:
      group: squigit-ocr-linux-metadata
      cancel-in-progress: false
    outputs:
      distribution_sha: ${{ steps.publish.outputs.ocr-repository-sha }}
    steps:
      - name: Checkout Distribution
        uses: actions/checkout@v6

      - name: Install metadata toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm createrepo-c dpkg-dev apt-utils gnupg2

      - name: Download released Linux packages
        id: packages
        shell: bash
        env:
          DEB_URL: ${{ needs.release-linux-packages.outputs.deb_asset_url }}
          DEB_NAME: ${{ needs.release-linux-packages.outputs.deb_name }}
          DEB_SHA256: ${{ needs.release-linux-packages.outputs.deb_sha256 }}
          RPM_URL: ${{ needs.release-linux-packages.outputs.rpm_asset_url }}
          RPM_NAME: ${{ needs.release-linux-packages.outputs.rpm_name }}
          RPM_SHA256: ${{ needs.release-linux-packages.outputs.rpm_sha256 }}
        run: |
          set -euo pipefail
          package_dir="${RUNNER_TEMP}/squigit-ocr-packages"
          mkdir -p "${package_dir}"
          curl --fail --location --retry 12 --retry-delay 10 "${DEB_URL}" -o "${package_dir}/${DEB_NAME}"
          curl --fail --location --retry 12 --retry-delay 10 "${RPM_URL}" -o "${package_dir}/${RPM_NAME}"
          echo "${DEB_SHA256}  ${package_dir}/${DEB_NAME}" | sha256sum -c -
          echo "${RPM_SHA256}  ${package_dir}/${RPM_NAME}" | sha256sum -c -
          echo "deb_path=${package_dir}/${DEB_NAME}" >> "$GITHUB_OUTPUT"
          echo "rpm_path=${package_dir}/${RPM_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish repository metadata
        id: publish
        uses: ./.github/actions/publish-linux-ocr-repo
        with:
          ocr-repository-token: ${{ secrets.GITHUB_TOKEN }}
          ocr-repository: squigit-org/distribution
          ocr-repository-branch: main
          ocr-version: ${{ needs.resolve-release-meta.outputs.version }}
          source-release-repo: squigit-org/distribution
          source-release-tag: ${{ needs.resolve-release-meta.outputs.release_tag }}
          deb-path: ${{ steps.packages.outputs.deb_path }}
          rpm-path: ${{ steps.packages.outputs.rpm_path }}
          gpg-private-key: ${{ secrets.LINUX_PACKAGES_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.LINUX_PACKAGES_GPG_PASSPHRASE }}
          publish-dnf-repo: ${{ needs.resolve-channel-scope.outputs.run_dnf }}
          pages-base-url: https://squigit-org.github.io/distribution
          apt-suite: stable

  update-homebrew-tap:
    name: Update Homebrew Tap
    if: >-
      always() &&
      needs.resolve-channel-scope.outputs.run_homebrew == 'true' &&
      needs.build-phase-complete.result == 'success' &&
      needs.release-macos-runtime.result == 'success'
    needs:
      - resolve-channel-scope
      - resolve-release-meta
      - build-phase-complete
      - release-macos-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Distribution
        uses: actions/checkout@v6

      - name: Sync OCR formula
        uses: ./.github/actions/update-homebrew-tap-formula
        with:
          tap-token: ${{ secrets.TAP_GITHUB_TOKEN }}
          tap-repo: squigit-org/homebrew-tap
          version: ${{ needs.resolve-release-meta.outputs.version }}
          asset-url: ${{ needs.release-macos-runtime.outputs.asset_url }}
          sha256: ${{ needs.release-macos-runtime.outputs.sha256 }}
          template-formula-path: ${{ github.workspace }}/packaging/homebrew/squigit-ocr.rb
          formula-file: squigit-ocr.rb
          commit-message: "Update squigit-ocr to v${{ needs.resolve-release-meta.outputs.version }}"

  validate-winget-manifest:
    name: Validate Winget Manifest
    if: >-
      always() &&
      needs.resolve-channel-scope.outputs.run_winget == 'true' &&
      needs.build-phase-complete.result == 'success' &&
      needs.release-windows-runtime.result == 'success'
    needs:
      - resolve-channel-scope
      - build-phase-complete
      - release-windows-runtime
    runs-on: windows-latest
    steps:
      - name: Checkout Distribution
        uses: actions/checkout@v6

      - name: Generate Winget manifest
        id: manifest
        uses: ./.github/actions/generate-winget-ocr-manifest
        with:
          ocr-identifier: SquigitOrg.SquigitOCR
          ocr-version: ${{ needs.release-windows-runtime.outputs.version }}
          ocr-name: Squigit OCR
          publisher: Squigit Org
          short-description: Standalone headless OCR CLI engine for Squigit
          installer-url: ${{ needs.release-windows-runtime.outputs.asset_url }}
          installer-sha256: ${{ needs.release-windows-runtime.outputs.sha256 }}
          command-alias: squigit-ocr
          nested-installer-path: squigit-ocr.exe
          output-dir: ${{ github.workspace }}/target/winget-manifest-ocr

      - name: Validate manifest with Winget
        shell: pwsh
        env:
          MANIFEST_DIR: ${{ steps.manifest.outputs.manifest-dir }}
        run: |
          $ErrorActionPreference = "Stop"
          & winget validate --manifest "$env:MANIFEST_DIR" --verbose
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed with exit code $LASTEXITCODE" }

      - name: Upload validated Winget manifest
        uses: actions/upload-artifact@v7
        with:
          name: winget-manifest-ocr
          path: ${{ steps.manifest.outputs.manifest-dir }}

  publish-winget-manifest:
    name: Publish Winget Manifest
    if: >-
      always() &&
      needs.resolve-channel-scope.outputs.run_winget == 'true' &&
      needs.release-windows-runtime.result == 'success' &&
      needs.validate-winget-manifest.result == 'success'
    needs:
      - resolve-channel-scope
      - resolve-release-meta
      - release-windows-runtime
      - validate-winget-manifest
    runs-on: windows-latest
    steps:
      - name: Checkout Distribution
        uses: actions/checkout@v6

      - name: Generate Winget manifest
        id: manifest
        uses: ./.github/actions/generate-winget-ocr-manifest
        with:
          ocr-identifier: SquigitOrg.SquigitOCR
          ocr-version: ${{ needs.release-windows-runtime.outputs.version }}
          ocr-name: Squigit OCR
          publisher: Squigit Org
          short-description: Standalone headless OCR CLI engine for Squigit
          installer-url: ${{ needs.release-windows-runtime.outputs.asset_url }}
          installer-sha256: ${{ needs.release-windows-runtime.outputs.sha256 }}
          command-alias: squigit-ocr
          nested-installer-path: squigit-ocr.exe
          output-dir: ${{ github.workspace }}/target/winget-manifest-ocr

      - name: Submit Winget update
        if: github.event_name == 'workflow_dispatch' && inputs.submit_winget_pr
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
          PACKAGE_IDENTIFIER: SquigitOrg.SquigitOCR
          PACKAGE_VERSION: ${{ needs.release-windows-runtime.outputs.version }}
          INSTALLER_URL: ${{ needs.release-windows-runtime.outputs.asset_url }}
          MANIFEST_DIR: ${{ steps.manifest.outputs.manifest-dir }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
            throw "WINGET_CREATE_GITHUB_TOKEN is required when submit_winget_pr is enabled"
          }

          $packageRoot = ($env:PACKAGE_IDENTIFIER -replace '\.', '/')
          $packageInitial = $env:PACKAGE_IDENTIFIER.Substring(0, 1).ToLowerInvariant()
          $manifestApiPath = "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/$packageInitial/$packageRoot"
          $headers = @{
            Accept = "application/vnd.github+json"
            "User-Agent" = "squigit-github-actions"
          }

          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $manifestLookup = Invoke-WebRequest -Uri $manifestApiPath -Headers $headers -SkipHttpErrorCheck

          if ($manifestLookup.StatusCode -eq 404) {
            .\wingetcreate.exe submit "$env:MANIFEST_DIR"
          } elseif ($manifestLookup.StatusCode -eq 200) {
            .\wingetcreate.exe update $env:PACKAGE_IDENTIFIER -u $env:INSTALLER_URL -v $env:PACKAGE_VERSION --submit
          } else {
            throw "Unexpected response checking winget-pkgs ($($manifestLookup.StatusCode)): $manifestApiPath"
          }

  test-apt-install:
    name: End-user APT Install Smoke
    if: >-
      always() &&
      needs.resolve-channel-scope.outputs.run_apt == 'true' &&
      needs.publish-linux-metadata.result == 'success'
    needs:
      - resolve-channel-scope
      - resolve-release-meta
      - publish-linux-metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Distribution
        uses: actions/checkout@v6

      - name: Configure distribution APT repository
        shell: bash
        env:
          DISTRIBUTION_SHA: ${{ needs.publish-linux-metadata.outputs.distribution_sha }}
        run: |
          set -euo pipefail
          base="https://github.com/squigit-org/distribution/raw/${DISTRIBUTION_SHA}"
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL "${base}/keys/distribution.asc" | gpg --dearmor | sudo tee /etc/apt/keyrings/distribution.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/distribution.gpg] ${base}/apt stable ocr" | sudo tee /etc/apt/sources.list.d/distribution.list >/dev/null

      - name: Install Squigit OCR from APT
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.resolve-release-meta.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if sudo apt-get update \
              && apt-cache policy squigit-ocr | awk '/Candidate:/ {print $2}' | grep -Fxq "${EXPECTED_VERSION}"; then
              break
            fi
            if [ "${attempt}" -eq 12 ]; then
              echo "APT metadata did not publish version ${{ needs.resolve-release-meta.outputs.version }} in time" >&2
              exit 1
            fi
            sleep 10
          done
          sudo apt-get install -y "squigit-ocr=${EXPECTED_VERSION}" jq

      - name: Run installed OCR
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.resolve-release-meta.outputs.version }}
        run: |
          set -euo pipefail
          actual_version="$(squigit-ocr --version | tr -d '\r' | tail -n 1)"
          test "${actual_version}" = "${EXPECTED_VERSION}"
          squigit-ocr tests/ocr-smoke.png | tee /tmp/ocr-output.json
          jq -e 'type == "array" and length > 0' /tmp/ocr-output.json >/dev/null
          text="$(jq -r '[.[] | .text // empty] | join(" | ")' /tmp/ocr-output.json)"
          normalized="$(printf '%s' "${text}" | tr '[:lower:]' '[:upper:]')"
          case "${normalized}" in *HELLO*PADDLEOCR*) ;; *) echo "Unexpected OCR text: ${text}" >&2; exit 1 ;; esac

  test-dnf-install:
    name: End-user DNF Install Smoke
    if: >-
      always() &&
      needs.resolve-channel-scope.outputs.run_dnf == 'true' &&
      needs.publish-linux-metadata.result == 'success'
    needs:
      - resolve-channel-scope
      - resolve-release-meta
      - publish-linux-metadata
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Checkout Distribution
        uses: actions/checkout@v6

      - name: Install repository tools
        shell: bash
        run: dnf install -y ca-certificates curl dnf-plugins-core gnupg2 jq

      - name: Configure distribution DNF repository
        shell: bash
        env:
          DISTRIBUTION_SHA: ${{ needs.publish-linux-metadata.outputs.distribution_sha }}
        run: |
          set -euo pipefail
          base="https://github.com/squigit-org/distribution/raw/${DISTRIBUTION_SHA}"
          cat > /etc/yum.repos.d/squigit-ocr.repo <<EOF
          [squigit-ocr]
          name=Squigit OCR
          baseurl=${base}/rpm/ocr
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=${base}/keys/distribution.asc
          EOF

      - name: Install Squigit OCR from DNF
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.resolve-release-meta.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if dnf makecache --refresh \
              && dnf repoquery --qf '%{version}' squigit-ocr | grep -Fxq "${EXPECTED_VERSION}"; then
              break
            fi
            if [ "${attempt}" -eq 12 ]; then
              echo "DNF metadata did not publish version ${EXPECTED_VERSION} in time" >&2
              exit 1
            fi
            sleep 10
          done
          dnf install -y squigit-ocr

      - name: Run installed OCR
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.resolve-release-meta.outputs.version }}
        run: |
          set -euo pipefail
          actual_version="$(squigit-ocr --version | tr -d '\r' | tail -n 1)"
          test "${actual_version}" = "${EXPECTED_VERSION}"
          squigit-ocr tests/ocr-smoke.png | tee /tmp/ocr-output.json
          jq -e 'type == "array" and length > 0' /tmp/ocr-output.json >/dev/null
          text="$(jq -r '[.[] | .text // empty] | join(" | ")' /tmp/ocr-output.json)"
          normalized="$(printf '%s' "${text}" | tr '[:lower:]' '[:upper:]')"
          case "${normalized}" in *HELLO*PADDLEOCR*) ;; *) echo "Unexpected OCR text: ${text}" >&2; exit 1 ;; esac

  test-homebrew-install:
    name: End-user Homebrew Install Smoke
    if: >-
      always() &&
      needs.resolve-channel-scope.outputs.run_homebrew == 'true' &&
      needs.update-homebrew-tap.result == 'success'
    needs:
      - resolve-channel-scope
      - resolve-release-meta
      - update-homebrew-tap
    runs-on: macos-14
    steps:
      - name: Checkout Distribution
        uses: actions/checkout@v6

      - name: Install Squigit OCR from Homebrew
        uses: ./.github/actions/homebrew-install-with-retry
        with:
          tap: squigit-org/tap
          formula: squigit-ocr
          initial-wait-seconds: "60"
          attempts: "6"
          sleep-seconds: "20"

      - name: Run formula and installed OCR checks
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.resolve-release-meta.outputs.version }}
        run: |
          set -euo pipefail
          brew test squigit-ocr
          actual_version="$(squigit-ocr --version | tr -d '\r' | tail -n 1)"
          test "${actual_version}" = "${EXPECTED_VERSION}"
          squigit-ocr tests/ocr-smoke.png | tee /tmp/ocr-output.json
          jq -e 'type == "array" and length > 0' /tmp/ocr-output.json >/dev/null
          text="$(jq -r '[.[] | .text // empty] | join(" | ")' /tmp/ocr-output.json)"
          normalized="$(printf '%s' "${text}" | tr '[:lower:]' '[:upper:]')"
          case "${normalized}" in *HELLO*PADDLEOCR*) ;; *) echo "Unexpected OCR text: ${text}" >&2; exit 1 ;; esac

  test-winget-install:
    name: End-user Winget Install Smoke
    if: >-
      always() &&
      needs.resolve-channel-scope.outputs.run_winget == 'true' &&
      needs.release-windows-runtime.result == 'success' &&
      needs.publish-winget-manifest.result == 'success'
    needs:
      - resolve-channel-scope
      - resolve-release-meta
      - release-windows-runtime
      - publish-winget-manifest
    runs-on: windows-latest
    steps:
      - name: Checkout Distribution
        uses: actions/checkout@v6

      - name: Install Squigit OCR from Winget or release archive
        id: install
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.resolve-release-meta.outputs.version }}
          ASSET_URL: ${{ needs.release-windows-runtime.outputs.asset_url }}
        run: |
          $ErrorActionPreference = "Continue"
          winget uninstall --id SquigitOrg.SquigitOCR --scope user --silent --disable-interactivity --accept-source-agreements
          winget install --id SquigitOrg.SquigitOCR --exact --source winget --scope user --silent --disable-interactivity --accept-source-agreements --accept-package-agreements

          $command = Get-Command squigit-ocr -ErrorAction SilentlyContinue
          if ($command) {
            $version = (& $command.Source --version | Select-Object -Last 1).Trim()
            if ($version -eq $env:EXPECTED_VERSION) {
              "ocr_exe=$($command.Source)" >> $env:GITHUB_OUTPUT
              "install_mode=winget-source" >> $env:GITHUB_OUTPUT
              exit 0
            }
          }

          $ErrorActionPreference = "Stop"
          $runtime = Join-Path $env:RUNNER_TEMP "squigit-ocr-winget-fallback"
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null
          $archive = Join-Path $runtime "squigit-ocr-win-x64.zip"
          Invoke-WebRequest $env:ASSET_URL -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime -Force
          "ocr_exe=$(Join-Path $runtime 'squigit-ocr.exe')" >> $env:GITHUB_OUTPUT
          "install_mode=release-archive" >> $env:GITHUB_OUTPUT

      - name: Report Windows install path
        shell: pwsh
        env:
          INSTALL_MODE: ${{ steps.install.outputs.install_mode }}
        run: |
          "Windows validation path: $env:INSTALL_MODE" >> $env:GITHUB_STEP_SUMMARY

      - name: Run installed OCR
        shell: pwsh
        env:
          OCR_EXE: ${{ steps.install.outputs.ocr_exe }}
          EXPECTED_VERSION: ${{ needs.resolve-release-meta.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $actualVersion = (& $env:OCR_EXE --version | Select-Object -Last 1).Trim()
          if ($actualVersion -ne $env:EXPECTED_VERSION) {
            throw "OCR version mismatch: installed=$actualVersion expected=$env:EXPECTED_VERSION"
          }
          $outputPath = Join-Path $env:RUNNER_TEMP "ocr-output.json"
          & $env:OCR_EXE "tests/ocr-smoke.png" | Tee-Object -FilePath $outputPath
          $payload = @(Get-Content -LiteralPath $outputPath -Raw | ConvertFrom-Json)
          if ($payload.Count -eq 0) { throw "OCR payload is empty" }
          $text = (($payload | ForEach-Object { $_.text }) -join " | ")
          if ($text -notmatch "(?i)hello.*paddleocr") { throw "Unexpected OCR text: $text" }
